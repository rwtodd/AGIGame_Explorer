name: CI

on:
  push:
  pull_request:

# Game files are never committed (see doc/testing.md), so on CI the
# data-dependent tests report SKIPPED via test/support/reference_games.dart.
# A failure to compile/analyze or any synthetic-test failure fails the job.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: dart analyze + flutter test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (repo gate, AGENTS.md §3)
        run: dart analyze

      - name: Test (reference-game tests skip without game data)
        run: flutter test
